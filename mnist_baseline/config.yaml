# MNIST Training Configuration
seed: 42
device: "cuda"  # auto-detected in code if available

# Data
data_dir: "./data"
batch_size: 128
num_workers: 4
pin_memory: true

# Model
input_size: 784
hidden_sizes: [256, 128]
num_classes: 10
dropout: 0.2

# Training
epochs: 20
lr: 1.0e-3
weight_decay: 1.0e-4
scheduler_step: 7
scheduler_gamma: 0.1
early_stopping_patience: 5

# Logging & Checkpoint
log_interval: 100          # 每N个batch打印一次
val_interval: 1            # 每N个epoch验证一次
checkpoint_dir: "./checkpoints"
use_tensorboard: true
runs_dir: "./runs"

# Reproducibility
deterministic: true
benchmark: false
